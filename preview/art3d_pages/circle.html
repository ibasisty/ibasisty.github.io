<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./page2/normalize.css">
    <link rel="stylesheet" href="./page2/style.css">
    <title>Circle</title>
</head>
<body>
  <div class="chart-container">
    <div class="pie-chart">
      <div class="slice slice-1" data-id="item1"></div>
      <div class="slice slice-2" data-id="item2"></div>
      <div class="slice slice-3" data-id="item3"></div>
    </div>

    <div class="legend">
      <div class="legend-item" data-id="item1">
        <div class="legend-color" style="background: #FF69B4"></div>
        <span class="legend-label">Розовый сегмент</span>
      </div>
      <div class="legend-item" data-id="item3">
        <div class="legend-color" style="background: #97BB31"></div>
        <span class="legend-label">Зеленый сегмент</span>
      </div>
      <div class="legend-item" data-id="item2">
        <div class="legend-color" style="background: #D9D9D9"></div>
        <span class="legend-label">Серый сегмент</span>
      </div>
    </div>
  </div>
    <script src="./page2/script.js"></script>
</body>
</html>
